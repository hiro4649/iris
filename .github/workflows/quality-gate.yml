# CODEX_QUALITY_HARNESS_FILE v0.8.2
name: quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Codex target quality gate
        shell: bash
        env:
          CODEX_HARNESS_MODE: "target"
          CODEX_PROFILE_COMPAT_MODE: "off"
          CODEX_QUALITY_REPORT: "json"
          CODEX_OPENAI_METHOD_REPORT: "json"
          CODEX_SKIP_NPM: "1"
          CODEX_EVENT_NAME: ${{ github.event_name }}
          CODEX_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CODEX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CODEX_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CODEX_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          classification_exit=0
          node scripts/codex-change-classification-gate.mjs --json > "$RUNNER_TEMP/codex-change-classification.json" || classification_exit=$?
          needs_npm="$(node - "$RUNNER_TEMP/codex-change-classification.json" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          let report = null;
          try { report = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          const status = report?.changeClassificationStatus || {};
          const needs = Boolean(status.productRelevantChanged || status.runtimeReadinessClaimed || status.packageOrLockfileChanged);
          process.stdout.write(needs ? 'true' : 'false');
          NODE
          )"
          if [ "$needs_npm" = "true" ]; then
            unset CODEX_SKIP_NPM
            unset CODEX_NPM_SKIP_REASON
            npm_exit=0
            npm test > "$RUNNER_TEMP/codex-npm-test-safe-hidden.log" 2>&1 || npm_exit=$?
            if [ "$npm_exit" -ne 0 ]; then
              node - "$RUNNER_TEMP/codex-npm-test-safe-hidden.log" "$npm_exit" <<'NODE' > codex-npm-test-safe-summary.json
          const fs = require('fs');
          const logFile = process.argv[2];
          const npmExitCode = Number.parseInt(process.argv[3] || '1', 10);
          let text = '';
          try { text = fs.readFileSync(logFile, 'utf8'); } catch {}
          const markerRules = [
            ['bom_parse_failure', /\bBOM\b|\uFEFF|Unexpected token .* JSON at position 0/i],
            ['json_parse_failure', /JSON\.parse|Unexpected token .*JSON|Unexpected end of JSON|SyntaxError.*JSON/i],
            ['module_not_found', /ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND|Cannot find module/i],
            ['missing_dependency', /Cannot find package|npm ERR! missing|ENOENT.*node_modules/i],
            ['node_syntax_check_failure', /SyntaxError|Unexpected token/i],
            ['permission_or_path_issue', /EACCES|EPERM|ENOENT/i],
            ['timeout_or_killed', /timed out|timeout|SIGKILL|Killed/i],
            ['test_fixture_failure', /not ok|AssertionError|test failed|FAIL/i],
          ];
          let category = 'unknown_npm_failure';
          let markerCount = 0;
          for (const [label, pattern] of markerRules) {
            if (pattern.test(text)) {
              markerCount += 1;
              if (category === 'unknown_npm_failure') category = label;
            }
          }
          const testCountMatch = text.match(/\b(\d{1,5})\s+tests?\b/i);
          const testCount = testCountMatch ? Number.parseInt(testCountMatch[1], 10) : null;
          const platform = ['linux', 'win32', 'darwin'].includes(process.platform) ? process.platform : 'other';
          const report = {
            schema: 'codex_npm_test_safe_summary_v1',
            status: 'fail',
            safeSummaryOnly: true,
            npm_exit_code: Number.isFinite(npmExitCode) ? npmExitCode : 1,
            node_version_major: Number.parseInt(process.versions.node.split('.')[0] || '0', 10),
            platform,
            package_json_exists: fs.existsSync('package.json'),
            run_tests_js_exists: fs.existsSync('scripts/run-tests.js'),
            node_modules_exists: fs.existsSync('node_modules'),
            package_install_present: fs.existsSync('node_modules'),
            test_count_detected: testCount,
            safe_failure_category: category,
            safe_failure_marker_count: markerCount,
            raw_values_printed: false,
          };
          process.stdout.write(`${JSON.stringify(report, null, 2)}\n`);
          NODE
            fi
            export CODEX_PRODUCT_VERIFICATION_COMMANDS="npm test"
            export CODEX_PRODUCT_VERIFICATION_SOURCE="remote_quality_gate"
            if [ "$npm_exit" -eq 0 ]; then
              export CODEX_PRODUCT_VERIFICATION_RESULT="pass"
              echo "remote npm test result: pass"
            else
              export CODEX_PRODUCT_VERIFICATION_RESULT="fail"
              echo "remote npm test result: fail"
            fi
          else
            export CODEX_SKIP_NPM="1"
            export CODEX_NPM_SKIP_REASON="harness-only or docs-only target workflow"
          fi
          gate_exit=0
          node scripts/codex-local-quality-gate.mjs > "$RUNNER_TEMP/codex-quality-gate.json" || gate_exit=$?
          node scripts/codex-workflow-quality-runner.mjs --report "$RUNNER_TEMP/codex-quality-gate.json" --gate-exit "$gate_exit"
      - name: Write safe target summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch { return null; }
          }
          const summary = readJson('codex-quality-gate-safe-summary.json');
          const target = readJson('codex-target-quality-summary.json');
          const reasons = readJson('codex-failure-reasons.json') || [];
          const npmSummary = readJson('codex-npm-test-safe-summary.json');
          console.log('## Codex target quality gate safe summary');
          if (summary) {
            console.log(`- status: ${summary.status || 'missing'}`);
            console.log(`- mode: ${summary.mode || 'missing'}`);
            console.log(`- targetMergeReady: ${summary.targetMergeReady ?? 'not_applicable'}`);
            console.log(`- targetQualityScoreStatus: ${target?.targetQualityScoreStatus?.status || summary.targetQualityScoreStatus?.status || 'missing'}`);
            console.log(`- targetQualityScore: ${target?.targetQualityScoreStatus?.score ?? summary.targetQualityScoreStatus?.score ?? 'missing'}`);
            console.log(`- agentsContextStatus: ${summary.agentsContextStatus?.status || 'missing'}`);
            console.log(`- productVerificationStatus: ${summary.productVerificationStatus?.status || 'missing'}`);
            console.log(`- secretScan: ${summary.secretScan?.status || 'missing'}`);
          } else {
            console.log('- status: summary_missing');
          }
          if (npmSummary) {
            console.log(`- npmDiagnosticStatus: ${npmSummary.status || 'missing'}`);
            console.log(`- npmFailureCategory: ${npmSummary.safe_failure_category || 'missing'}`);
            console.log(`- npmFailureMarkerCount: ${npmSummary.safe_failure_marker_count ?? 'missing'}`);
            console.log(`- npmExitCode: ${npmSummary.npm_exit_code ?? 'missing'}`);
          }
          console.log(`- failureReasonCount: ${Array.isArray(reasons) ? reasons.length : 0}`);
          for (const item of Array.isArray(reasons) ? reasons.slice(0, 20) : []) {
            const reasonCode = String(item.reasonCode || 'unknown').replace(/[^A-Za-z0-9_.:-]/g, '_');
            const safeMessage = String(item.safeMessage || 'safe_message_missing').replace(/[^A-Za-z0-9_.:= -]/g, '_').slice(0, 180);
            console.log(`- ${reasonCode}: ${safeMessage}`);
          }
          NODE
      - name: Upload safe quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-quality-gate-safe-artifacts
          path: |
            codex-quality-gate-safe-summary.json
            codex-evidence-pack.normalized.json
            codex-failure-reasons.json
            codex-target-quality-summary.json
            codex-test-metrics.safe.json
            codex-npm-test-safe-summary.json
          if-no-files-found: ignore
