# CODEX_QUALITY_HARNESS_FILE v0.8.4
name: quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm install --no-package-lock
          fi
      - name: Install monorepo dependencies if present
        shell: bash
        run: |
          set -euo pipefail
          for dir in apps/backend apps/frontend contracts; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm install --no-package-lock)
            fi
          done
      - name: Run Codex quality gate
        shell: bash
        env:
          CODEX_QUALITY_REPORT: "json"
          CODEX_OPENAI_METHOD_REPORT: "json"
          CODEX_EVIDENCE_PACK_STRICT: "1"
          CODEX_HUMAN_CONFIRMATION_STRICT: "1"
          CODEX_EVENT_NAME: ${{ github.event_name }}
          CODEX_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CODEX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CODEX_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CODEX_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f CODEX_SOURCE_HARNESS_MANIFEST.json ]; then
            export CODEX_HARNESS_SOURCE_REPO=1
            export CODEX_HARNESS_MODE=core
            export CODEX_PROFILE_COMPAT_MODE=optional
            export CODEX_REQUIRE_NPM=1
          else
            export CODEX_HARNESS_MODE=target
            export CODEX_PROFILE_COMPAT_MODE=off
            if [ -n "${GITHUB_BASE_REF:-}" ]; then
              git fetch origin "$GITHUB_BASE_REF" --depth=1 >/dev/null 2>&1 || true
              changed_files="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null | paste -sd, - || true)"
              if [ -n "$changed_files" ]; then
                export CODEX_CHANGED_FILES="$changed_files"
              fi
            fi
            product_npm_required="$(
              node --input-type=module -e "import { classifyChange, changedFiles } from './scripts/codex-change-classification-gate.mjs'; const classified = classifyChange(changedFiles(process.env), process.env); const c = classified.classification || {}; process.stdout.write(classified.productRelevantChanged || classified.packageOrLockfileChanged || classified.runtimeReadinessClaimed || c.performanceClaimed ? '1' : '0');"
            )" || product_npm_required="1"
            if [ "$product_npm_required" = "1" ]; then
              unset CODEX_SKIP_NPM || true
              npm_hidden_log="$RUNNER_TEMP/codex-npm-test.hidden.log"
              npm_start_ms="$(node -e "process.stdout.write(String(Date.now()))")"
              set +e
              if [ -f package.json ]; then
                npm test > "$npm_hidden_log" 2>&1
                npm_exit=$?
              else
                npm_exit=127
                : > "$npm_hidden_log"
              fi
              set -e
              npm_end_ms="$(node -e "process.stdout.write(String(Date.now()))")"
              npm_duration_ms="$((npm_end_ms - npm_start_ms))"
              npm_result="fail"
              if [ "$npm_exit" = "0" ]; then
                npm_result="pass"
              fi
              test_count="$(
                node -e 'const fs = require("fs"); const file = process.argv[1]; let text = ""; try { text = fs.readFileSync(file, "utf8"); } catch {} const patterns = [/(\d+)\s+tests?\b/i, /tests\s+(\d+)\b/i, /#\s*tests\s+(\d+)\b/i]; for (const pattern of patterns) { const match = text.match(pattern); if (match) { process.stdout.write(match[1]); process.exit(0); } }' "$npm_hidden_log"
              )"
              export CODEX_PRODUCT_VERIFICATION_COMMANDS="npm test"
              export CODEX_PRODUCT_VERIFICATION_RESULT="$npm_result"
              export CODEX_PRODUCT_VERIFICATION_SOURCE="remote_quality_gate"
              export CODEX_REMOTE_PRODUCT_BASELINE_COMMANDS="npm test"
              export CODEX_REMOTE_PRODUCT_BASELINE_RESULT="$npm_result"
              export CODEX_REMOTE_PRODUCT_BASELINE_SOURCE="remote_quality_gate"
              export CODEX_TEST_METRICS_COMMAND="npm test"
              export CODEX_TEST_METRICS_RESULT="$npm_result"
              export CODEX_TEST_METRICS_DURATION_MS="$npm_duration_ms"
              export CODEX_TEST_METRICS_SOURCE="remote"
              if [ -n "$test_count" ]; then
                export CODEX_TEST_METRICS_TEST_COUNT="$test_count"
              fi
              if [ "$npm_result" = "fail" ]; then
                export CODEX_NPM_TEST_SAFE_SUMMARY_JSON="$(
                  NPM_EXIT="$npm_exit" node -e 'const summary = { npmExitCode: Number(process.env.NPM_EXIT || 1), safeFailureCategory: "unknown_npm_failure", nodeMajor: Number(process.versions.node.split(".")[0]), platform: process.platform, packageManager: "npm", commandClass: "npm_test", testCountDetected: Number.isFinite(Number(process.env.CODEX_TEST_METRICS_TEST_COUNT)) ? Number(process.env.CODEX_TEST_METRICS_TEST_COUNT) : null, rawLogUploaded: false, rawValuesStored: false, safeSummaryOnly: true }; process.stdout.write(JSON.stringify(summary));'
                )"
                export CODEX_NPM_EXIT_CODE="$npm_exit"
              fi
            else
              export CODEX_SKIP_NPM="${CODEX_SKIP_NPM:-1}"
              export CODEX_NPM_SKIP_REASON="${CODEX_NPM_SKIP_REASON:-harness-only or docs-only target fast path}"
            fi
          fi
          node scripts/codex-workflow-preflight.mjs > "$RUNNER_TEMP/codex-workflow-preflight.json"
          gate_exit=0
          node scripts/codex-local-quality-gate.mjs > "$RUNNER_TEMP/codex-quality-gate.json" || gate_exit=$?
          node scripts/codex-workflow-preflight.mjs --write-artifact > "$RUNNER_TEMP/codex-workflow-preflight-artifact.json"
          node scripts/codex-workflow-quality-runner.mjs --report "$RUNNER_TEMP/codex-quality-gate.json" --gate-exit "$gate_exit"
      - name: Write safe quality summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch { return null; }
          }
          const summary = readJson('codex-quality-gate-safe-summary.json');
          const diagnostic = readJson('codex-diagnostic-consolidated-summary.json');
          const reasons = readJson('codex-failure-reasons.json') || [];
          console.log('## Codex quality gate safe summary');
          if (summary) {
            console.log(`- status: ${summary.status || 'missing'}`);
            console.log(`- mode: ${summary.mode || 'missing'}`);
            console.log(`- mergeReady: ${summary.mergeReady}`);
            console.log(`- targetMergeReady: ${summary.targetMergeReady ?? 'not_applicable'}`);
            console.log(`- humanReviewRequired: ${summary.humanReviewRequired}`);
            console.log(`- qualityScoreStatus: ${summary.qualityScoreStatus?.status || 'missing'}`);
            console.log(`- qualityScore: ${summary.qualityScoreStatus?.score ?? 'missing'}`);
            console.log(`- pathMode: ${diagnostic?.pathMode || 'missing'}`);
            console.log(`- topNextAction: ${diagnostic?.nextActions?.[0] || 'missing'}`);
          } else {
            console.log('- status: summary_missing');
          }
          console.log(`- failureReasonCount: ${Array.isArray(reasons) ? reasons.length : 0}`);
          for (const item of Array.isArray(reasons) ? reasons.slice(0, 20) : []) {
            const reasonCode = String(item.reasonCode || 'unknown').replace(/[^A-Za-z0-9_.:-]/g, '_');
            const safeMessage = String(item.safeMessage || 'safe_message_missing').replace(/[^A-Za-z0-9_.:= -]/g, '_').slice(0, 180);
            console.log(`- ${reasonCode}: ${safeMessage}`);
          }
          NODE
      - name: Upload safe quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-quality-gate-safe-artifacts
          path: |
            codex-quality-gate-safe-summary.json
            codex-diagnostic-consolidated-summary.json
            codex-evidence-pack.normalized.json
            codex-failure-reasons.json
            codex-invalid-report-recovery-summary.json
            codex-target-quality-summary.json
            codex-source-final-summary.json
            codex-target-final-summary.json
            codex-safe-artifact-index.json
            codex-workflow-preflight.safe.json
            codex-test-metrics.safe.json
          if-no-files-found: ignore
